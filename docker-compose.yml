version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: parkingapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parkingapp
      POSTGRES_PASSWORD: parkingapp_password
      POSTGRES_DB: parking_saas
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parkingapp']
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parkingapp-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://parkingapp:parkingapp_password@postgres:5432/parking_saas?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-secret-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - '3000:3000'
    volumes:
      - ./logs:/app/logs

volumes:
  postgres_data:
